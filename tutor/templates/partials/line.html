{% set streaming = streaming|default(false) %}
<section class="line{% if active %} active{% endif %}{% if entry.explanation is not none or streaming %} has-explanation{% endif %}{% if streaming %} streaming{% endif %}" id="line-{{ entry.id }}" data-anchor-id="{{ entry.id }}">
  <button type="button" class="raw-toggle">{{ raw_escaped | safe }}</button>
  <div class="line-detail">
    {% if entry.explanation is not none %}
    <div class="explanation-body">{{ explanation_html | safe }}</div>
    <div class="line-threads" data-anchor-id="{{ entry.id }}"></div>
    <div class="line-actions">
      <form hx-post="/tutor/{{ view_dir | urlencode }}/commands/open_thread"
            hx-target="#thread-conversation"
            hx-swap="innerHTML"
            hx-disabled-elt="find button">
        <input type="hidden" name="anchor_id" value="{{ entry.id }}">
        <button type="submit" class="btn btn-ask">
          <span class="btn-label-idle">Ask</span>
          <span class="btn-label-busy">Opening…</span>
        </button>
      </form>
      <form hx-post="/tutor/{{ view_dir | urlencode }}/commands/clear_explanation"
            hx-confirm="Delete this explanation and its threads?"
            hx-swap="none"
            hx-disabled-elt="find button">
        <input type="hidden" name="anchor_id" value="{{ entry.id }}">
        <button type="submit" class="btn btn-del">
          <span class="btn-label-idle">Delete</span>
          <span class="btn-label-busy">Deleting…</span>
        </button>
      </form>
    </div>
    {% elif streaming %}
    <div class="explanation-body explain-stream-body">
      <div id="explain-stream-{{ entry.id }}" class="explain-stream"></div>
    </div>
    <div class="line-actions">
      <span class="explain-status">Explaining…</span>
    </div>
    {% else %}
    {% if error_message %}
    <div class="line-error" role="alert" aria-live="polite">{{ error_message }}</div>
    {% endif %}
    <div class="line-actions">
      <form hx-post="/tutor/{{ view_dir | urlencode }}/commands/explain"
            hx-target="#line-{{ entry.id }}"
            hx-swap="outerHTML"
            hx-disabled-elt="find button">
        <input type="hidden" name="entry_id" value="{{ entry.id }}">
        <button type="submit" class="btn btn-ask">
          <span class="btn-label-idle">Explain</span>
          <span class="btn-label-busy">Explaining…</span>
        </button>
      </form>
    </div>
    {% endif %}
  </div>
</section>
