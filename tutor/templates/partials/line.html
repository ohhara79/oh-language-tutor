<section class="line" id="line-{{ entry.id }}" data-anchor-id="{{ entry.id }}">
  <button type="button" class="raw-toggle">{{ raw_escaped | safe }}</button>
  <div class="line-threads" data-anchor-id="{{ entry.id }}"></div>
  <div class="line-detail">
    {% if entry.explanation is not none %}
    <div class="explanation-body">{{ explanation_html | safe }}</div>
    <div class="line-actions">
      <form hx-post="/commands/open_thread"
            hx-target="#thread-conversation"
            hx-swap="innerHTML">
        <input type="hidden" name="anchor_id" value="{{ entry.id }}">
        <button type="submit" class="btn btn-ask">Ask</button>
      </form>
      <form hx-post="/commands/delete_tutor_entry"
            hx-confirm="Delete this line and its threads?"
            hx-swap="none">
        <input type="hidden" name="anchor_id" value="{{ entry.id }}">
        <button type="submit" class="btn btn-del">Delete</button>
      </form>
    </div>
    {% else %}
    <div class="line-actions">
      <form hx-post="/commands/explain"
            hx-target="#line-{{ entry.id }}"
            hx-swap="outerHTML">
        <input type="hidden" name="entry_id" value="{{ entry.id }}">
        <button type="submit" class="btn btn-ask">Explain</button>
      </form>
      <form hx-post="/commands/delete_tutor_entry"
            hx-confirm="Delete this line?"
            hx-swap="none">
        <input type="hidden" name="anchor_id" value="{{ entry.id }}">
        <button type="submit" class="btn btn-del">Delete</button>
      </form>
    </div>
    {% endif %}
  </div>
</section>
