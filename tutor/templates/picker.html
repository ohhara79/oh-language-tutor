<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oh-language-tutor — pick dataset</title>
<link rel="stylesheet" href="/static/app.css?v={{ version }}">
</head>
<body class="view-picker">
  <header>
    <div class="header-row">
      <h1>oh-language-tutor</h1>
      <button type="button" id="menu-btn" class="btn menu-btn"
              aria-haspopup="true" aria-expanded="false" aria-controls="menu-panel"
              aria-label="Menu">&#9776;</button>
    </div>
    <div id="menu-panel" class="menu-panel" hidden>
      <button type="button" id="reset-settings" class="menu-item">Reset settings</button>
    </div>
  </header>

  <main id="picker-pane">
    {% if dirs %}
    <form method="post" action="/commands/open_state_dir" class="picker-form">
      <ul class="picker-list">
        {% for name in dirs %}
        <li class="picker-item">
          <label>
            <input type="radio" name="dir_name" value="{{ name }}"
                   {% if name == current_view %}checked{% endif %}>
            <span class="picker-name">{{ name }}</span>
            {% if name == writing_dir %}<span class="picker-badge">writes here</span>{% endif %}
          </label>
        </li>
        {% endfor %}
      </ul>
      <button type="submit" class="btn picker-submit">Open</button>
    </form>
    {% else %}
    <p class="empty">No tutor data directories found.</p>
    {% endif %}
  </main>

  <script src="/static/picker.js?v={{ version }}"></script>
</body>
</html>
